name: Compilar Mod Agua Realista 1.20.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gerar arquivos do mod automaticamente
        run: |
          mkdir -p src/main/resources/META-INF src/main/java/com/aguarealista/client

          cat << 'END_SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }

          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
          }

          rootProject.name = 'aguarealista'
          END_SETTINGS

          cat << 'END_GRADLE' > build.gradle
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.0.0'
          group = 'com.aguarealista'

          base {
              archivesName = 'aguarealista-1.20.1'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                          "Specification-Title"     : "aguarealista",
                          "Specification-Vendor"    : "AguaRealista",
                          "Specification-Version"   : "1",
                          "Implementation-Title"    : project.name,
                          "Implementation-Version"  : project.version,
                          "Implementation-Vendor"   : "AguaRealista"
                  ])
              }
              finalizedBy 'reobfJar'
          }
          END_GRADLE

          cat << 'END_META' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "Agua Realista resources",
              "pack_format": 15
            }
          }
          END_META

          cat << 'END_TOML' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="aguarealista"
          version="1.0.0"
          displayName="Agua Realista"
          description='''
          Agua realista sem shaders com ondas 3D dinamicas, espuma nas bordas, reflexos simulados e fisica de movimento.
          '''

          [[dependencies.aguarealista]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.aguarealista]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          END_TOML

          cat << 'END_MOD' > src/main/java/com/aguarealista/AguaRealistaMod.java
          package com.aguarealista;

          import net.minecraftforge.fml.common.Mod;

          @Mod(AguaRealistaMod.MODID)
          public class AguaRealistaMod {
              public static final String MODID = "aguarealista";

              public AguaRealistaMod() {
              }
          }
          END_MOD

          cat << 'END_PHYSICS' > src/main/java/com/aguarealista/WaterPhysicsHandler.java
          package com.aguarealista;

          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.item.ItemEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.vehicle.Boat;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = AguaRealistaMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE)
          public class WaterPhysicsHandler {

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }

                  Player player = event.player;
                  Level level = player.level();
                  if (level.isClientSide() || !player.isInWater()) {
                      return;
                  }

                  Vec3 motion = player.getDeltaMovement();
                  double horizSpeed = Math.sqrt(motion.x * motion.x + motion.z * motion.z);
                  double vertSpeed = Math.abs(motion.y);

                  if (horizSpeed < 0.06 && vertSpeed < 0.14) {
                      return;
                  }

                  AABB area = player.getBoundingBox().inflate(3.5, 1.5, 3.5);
                  for (Entity target : level.getEntities(player, area)) {
                      if (!target.isInWater()) {
                          continue;
                      }
                      if (!(target instanceof ItemEntity || target instanceof Boat || target instanceof LivingEntity)) {
                          continue;
                      }

                      double dx = target.getX() - player.getX();
                      double dz = target.getZ() - player.getZ();
                      double dist = Math.sqrt(dx * dx + dz * dz);

                      if (dist > 0.15 && dist < 3.5) {
                          double falloff = 1.0 - (dist / 3.5);
                          double force = falloff * Math.min(0.085, horizSpeed * 0.22 + vertSpeed * 0.16);
                          if (target instanceof ItemEntity) {
                              force *= 1.8;
                          } else if (target instanceof Boat) {
                              force *= 0.8;
                          }

                          target.push((dx / dist) * force, 0.008 * force, (dz / dist) * force);
                      }
                  }
              }
          }
          END_PHYSICS

          cat << 'END_MANAGER' > src/main/java/com/aguarealista/client/WaterWaveManager.java
          package com.aguarealista.client;

          import com.aguarealista.AguaRealistaMod;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.item.ItemEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.vehicle.Boat;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import java.util.Random;

          @Mod.EventBusSubscriber(modid = AguaRealistaMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class WaterWaveManager {

              public static final int MAX_WAVES = 90;
              private static final int SURFACE_SCAN_RADIUS = 13;

              private static final List<Wave> WAVES = new ArrayList<>();
              private static final List<WaterCell> WATER_CELLS = new ArrayList<>();
              private static final Map<Integer, Boolean> WAS_IN_WATER = new HashMap<>();
              private static final Random RANDOM = new Random();

              private static int tickCounter = 0;

              public static class Wave {
                  public final double x;
                  public final double y;
                  public final double z;
                  public final float maxRadius;
                  public final float speed;
                  public final float strength;
                  public final boolean foamRing;
                  public float radius;
                  public float prevRadius;
                  public int age;
                  public final int maxAge;

                  public Wave(double x, double y, double z, float maxRadius, float speed, float strength, boolean foamRing) {
                      this.x = x;
                      this.y = y;
                      this.z = z;
                      this.maxRadius = maxRadius;
                      this.speed = speed;
                      this.strength = strength;
                      this.foamRing = foamRing;
                      this.radius = 0.12f;
                      this.prevRadius = 0.12f;
                      this.age = 0;
                      this.maxAge = Math.max(12, (int) (maxRadius / speed));
                  }

                  public void tick() {
                      this.prevRadius = this.radius;
                      this.radius += this.speed;
                      this.age++;
                  }

                  public float getInterpolatedRadius(float partialTick) {
                      return this.prevRadius + (this.radius - this.prevRadius) * partialTick;
                  }

                  public float getProgress(float partialTick) {
                      return Math.min(1.0f, (this.age + partialTick) / (float) this.maxAge);
                  }

                  public boolean isExpired() {
                      return this.age >= this.maxAge || this.radius >= this.maxRadius;
                  }
              }

              public static class WaterCell {
                  public final int x;
                  public final int y;
                  public final int z;
                  public final float surfaceY;
                  public final int shoreMask;
                  public final boolean skyVisible;

                  public WaterCell(int x, int y, int z, float surfaceY, int shoreMask, boolean skyVisible) {
                      this.x = x;
                      this.y = y;
                      this.z = z;
                      this.surfaceY = surfaceY;
                      this.shoreMask = shoreMask;
                      this.skyVisible = skyVisible;
                  }
              }

              public static List<Wave> getWaves() {
                  return WAVES;
              }

              public static List<WaterCell> getWaterCells() {
                  return WATER_CELLS;
              }

              public static void addWave(double x, double y, double z, float maxRadius, float speed, float strength, boolean foamRing) {
                  if (WAVES.size() >= MAX_WAVES) {
                      WAVES.remove(0);
                  }
                  WAVES.add(new Wave(x, y, z, maxRadius, speed, strength, foamRing));
              }

              public static float getWaveDisplacementAt(double wx, double wz, float partialTick) {
                  float total = 0.0f;
                  for (int i = 0; i < WAVES.size(); i++) {
                      Wave wave = WAVES.get(i);
                      double dx = wx - wave.x;
                      double dz = wz - wave.z;
                      double distSq = dx * dx + dz * dz;
                      float r = wave.getInterpolatedRadius(partialTick);
                      float bandWidth = wave.foamRing ? 0.55f : 0.28f;

                      if (distSq > (r + bandWidth) * (r + bandWidth)) {
                          continue;
                      }

                      double dist = Math.sqrt(distSq);
                      float diff = (float) Math.abs(dist - r);
                      if (diff < bandWidth) {
                          float progress = wave.getProgress(partialTick);
                          float fade = (1.0f - progress) * (1.0f - progress);
                          float bell = (float) Math.cos((diff / bandWidth) * (Math.PI * 0.5));
                          total += bell * bell * wave.strength * 0.14f * fade;
                      }
                  }
                  return Math.min(0.24f, total);
              }

              public static boolean isWaterAt(Level level, double x, double surfaceY, double z) {
                  BlockPos pos = BlockPos.containing(x, surfaceY - 0.25, z);
                  if (level.getFluidState(pos).is(FluidTags.WATER)) {
                      return true;
                  }
                  return level.getFluidState(pos.below()).is(FluidTags.WATER);
              }

              public static double findWaterSurfaceY(Level level, double x, double y, double z) {
                  int bx = (int) Math.floor(x);
                  int by = (int) Math.floor(y);
                  int bz = (int) Math.floor(z);
                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  BlockPos.MutableBlockPos above = new BlockPos.MutableBlockPos();

                  for (int offset = 3; offset >= -2; offset--) {
                      pos.set(bx, by + offset, bz);
                      FluidState fluid = level.getFluidState(pos);
                      if (fluid.is(FluidTags.WATER)) {
                          above.set(bx, by + offset + 1, bz);
                          if (!level.getFluidState(above).is(FluidTags.WATER)) {
                              return pos.getY() + fluid.getHeight(level, pos);
                          }
                      }
                  }
                  return Double.NaN;
              }

              @SubscribeEvent
              public static void onClientTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }

                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  Player localPlayer = mc.player;

                  if (level == null || localPlayer == null) {
                      WAVES.clear();
                      WATER_CELLS.clear();
                      WAS_IN_WATER.clear();
                      return;
                  }

                  if (mc.isPaused()) {
                      return;
                  }

                  tickCounter++;

                  Iterator<Wave> it = WAVES.iterator();
                  while (it.hasNext()) {
                      Wave wave = it.next();
                      wave.tick();
                      if (wave.isExpired()) {
                          it.remove();
                      }
                  }

                  if (tickCounter % 4 == 0) {
                      scanWaterSurface(level, localPlayer);
                  }

                  handleEntityWaves(level, localPlayer);
                  handleRainRipples(level);

                  if (tickCounter % 200 == 0 && WAS_IN_WATER.size() > 150) {
                      WAS_IN_WATER.clear();
                  }
              }

              private static void scanWaterSurface(ClientLevel level, Player player) {
                  WATER_CELLS.clear();

                  int px = (int) Math.floor(player.getX());
                  int py = (int) Math.floor(player.getY());
                  int pz = (int) Math.floor(player.getZ());

                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  BlockPos.MutableBlockPos check = new BlockPos.MutableBlockPos();

                  for (int dx = -SURFACE_SCAN_RADIUS; dx <= SURFACE_SCAN_RADIUS; dx++) {
                      for (int dz = -SURFACE_SCAN_RADIUS; dz <= SURFACE_SCAN_RADIUS; dz++) {
                          if (dx * dx + dz * dz > SURFACE_SCAN_RADIUS * SURFACE_SCAN_RADIUS) {
                              continue;
                          }
                          for (int dy = 5; dy >= -6; dy--) {
                              int wx = px + dx;
                              int wy = py + dy;
                              int wz = pz + dz;
                              pos.set(wx, wy, wz);

                              FluidState fluid = level.getFluidState(pos);
                              if (!fluid.is(FluidTags.WATER)) {
                                  continue;
                              }

                              check.set(wx, wy + 1, wz);
                              if (level.getFluidState(check).is(FluidTags.WATER)) {
                                  continue;
                              }

                              float surfaceY = wy + fluid.getHeight(level, pos);
                              int shoreMask = 0;

                              if (isSolidShore(level, check.set(wx, wy, wz - 1))) shoreMask |= 1;
                              if (isSolidShore(level, check.set(wx, wy, wz + 1))) shoreMask |= 2;
                              if (isSolidShore(level, check.set(wx + 1, wy, wz))) shoreMask |= 4;
                              if (isSolidShore(level, check.set(wx - 1, wy, wz))) shoreMask |= 8;

                              boolean skyVisible = level.canSeeSky(check.set(wx, wy + 1, wz));
                              WATER_CELLS.add(new WaterCell(wx, wy, wz, surfaceY, shoreMask, skyVisible));
                              break;
                          }
                      }
                  }
              }

              private static boolean isSolidShore(ClientLevel level, BlockPos pos) {
                  if (level.getFluidState(pos).is(FluidTags.WATER)) {
                      return false;
                  }
                  BlockState state = level.getBlockState(pos);
                  return !state.isAir() && !state.canBeReplaced();
              }

              private static void handleEntityWaves(ClientLevel level, Player localPlayer) {
                  AABB searchArea = localPlayer.getBoundingBox().inflate(18.0, 8.0, 18.0);
                  List<Entity> entities = level.getEntitiesOfClass(Entity.class, searchArea);

                  for (Entity entity : entities) {
                      if (!(entity instanceof LivingEntity || entity instanceof Boat || entity instanceof ItemEntity)) {
                          continue;
                      }

                      boolean inWater = entity.isInWater();
                      boolean wasIn = WAS_IN_WATER.getOrDefault(entity.getId(), false);
                      WAS_IN_WATER.put(entity.getId(), inWater);

                      if (!inWater) {
                          continue;
                      }

                      double surfaceY = findWaterSurfaceY(level, entity.getX(), entity.getY(), entity.getZ());
                      if (Double.isNaN(surfaceY)) {
                          continue;
                      }

                      double dx = entity.getX() - entity.xo;
                      double dy = entity.getY() - entity.yo;
                      double dz = entity.getZ() - entity.zo;
                      double horizSpeed = Math.sqrt(dx * dx + dz * dz);

                      if (!wasIn) {
                          float impact = (float) Math.min(1.5, Math.abs(dy) * 2.2 + 0.35);
                          addWave(entity.getX(), surfaceY, entity.getZ(), 2.4f + impact * 2.6f, 0.085f, 0.75f + impact * 0.55f, true);
                          addWave(entity.getX(), surfaceY, entity.getZ(), 1.6f + impact * 1.4f, 0.055f, 0.55f + impact * 0.3f, true);

                          int splashCount = (int) (8 + impact * 14);
                          for (int i = 0; i < splashCount; i++) {
                              double angle = RANDOM.nextDouble() * Math.PI * 2.0;
                              double sp = 0.06 + RANDOM.nextDouble() * 0.16 * impact;
                              level.addParticle(
                                      ParticleTypes.SPLASH,
                                      entity.getX() + Math.cos(angle) * 0.25,
                                      surfaceY + 0.05,
                                      entity.getZ() + Math.sin(angle) * 0.25,
                                      Math.cos(angle) * sp,
                                      0.12 + RANDOM.nextDouble() * 0.18 * impact,
                                      Math.sin(angle) * sp
                              );
                          }
                          continue;
                      }

                      if (horizSpeed > 0.03) {
                          int interval = (horizSpeed > 0.16) ? 2 : 4;
                          if ((tickCounter + entity.getId()) % interval == 0) {
                              float sizeScale = entity instanceof Boat ? 1.5f : (entity instanceof ItemEntity ? 0.55f : 1.0f);
                              float maxR = (1.5f + (float) Math.min(2.5, horizSpeed * 7.5)) * sizeScale;
                              float strength = (0.45f + (float) Math.min(0.65, horizSpeed * 2.4)) * sizeScale;

                              double wakeX = entity.getX() - (dx / horizSpeed) * 0.22;
                              double wakeZ = entity.getZ() - (dz / horizSpeed) * 0.22;
                              addWave(wakeX, surfaceY, wakeZ, maxR, 0.062f, strength, true);

                              int particles = horizSpeed > 0.15 ? 3 : 1;
                              for (int i = 0; i < particles; i++) {
                                  double ox = (RANDOM.nextDouble() - 0.5) * 0.45;
                                  double oz = (RANDOM.nextDouble() - 0.5) * 0.45;
                                  level.addParticle(
                                          ParticleTypes.SPLASH,
                                          wakeX + ox,
                                          surfaceY + 0.03,
                                          wakeZ + oz,
                                          -dx * 0.4 + (RANDOM.nextDouble() - 0.5) * 0.05,
                                          0.06 + horizSpeed * 0.35,
                                          -dz * 0.4 + (RANDOM.nextDouble() - 0.5) * 0.05
                                  );
                                  if (RANDOM.nextFloat() < 0.45f) {
                                      level.addParticle(
                                              ParticleTypes.BUBBLE_POP,
                                              wakeX + ox * 1.2,
                                              surfaceY + 0.02,
                                              wakeZ + oz * 1.2,
                                              0.0, 0.01, 0.0
                                      );
                                  }
                              }

                              if (entity == localPlayer && tickCounter % 12 == 0 && horizSpeed > 0.11) {
                                  level.playLocalSound(
                                          entity.getX(), surfaceY, entity.getZ(),
                                          SoundEvents.GENERIC_SWIM,
                                          SoundSource.PLAYERS,
                                          0.18f,
                                          1.05f + RANDOM.nextFloat() * 0.3f,
                                          false
                                  );
                              }
                          }
                      } else if ((tickCounter + entity.getId() * 7) % 26 == 0) {
                          addWave(entity.getX(), surfaceY, entity.getZ(), 1.35f, 0.032f, 0.28f, false);
                      }
                  }
              }

              private static void handleRainRipples(ClientLevel level) {
                  if (!level.isRaining() || WATER_CELLS.isEmpty()) {
                      return;
                  }

                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  for (int i = 0; i < 4; i++) {
                      WaterCell cell = WATER_CELLS.get(RANDOM.nextInt(WATER_CELLS.size()));
                      if (!cell.skyVisible) {
                          continue;
                      }
                      pos.set(cell.x, cell.y + 1, cell.z);
                      if (level.isRainingAt(pos)) {
                          double rx = cell.x + 0.15 + RANDOM.nextDouble() * 0.7;
                          double rz = cell.z + 0.15 + RANDOM.nextDouble() * 0.7;
                          addWave(rx, cell.surfaceY, rz, 0.78f, 0.042f, 0.35f, false);
                      }
                  }
              }
          }
          END_MANAGER

          cat << 'END_RENDERER' > src/main/java/com/aguarealista/client/WaterWaveRenderer.java
          package com.aguarealista.client;

          import com.aguarealista.AguaRealistaMod;
          import com.mojang.blaze3d.systems.RenderSystem;
          import com.mojang.blaze3d.vertex.BufferBuilder;
          import com.mojang.blaze3d.vertex.DefaultVertexFormat;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.Tesselator;
          import com.mojang.blaze3d.vertex.VertexFormat;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.renderer.GameRenderer;
          import net.minecraft.util.Mth;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderLevelStageEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import org.joml.Matrix4f;

          import java.util.List;

          @Mod.EventBusSubscriber(modid = AguaRealistaMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class WaterWaveRenderer {

              private static final int RING_SEGMENTS = 24;

              @SubscribeEvent
              public static void onRenderLevelStage(RenderLevelStageEvent event) {
                  if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_TRANSLUCENT_BLOCKS) {
                      return;
                  }

                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  if (level == null || mc.player == null) {
                      return;
                  }

                  List<WaterWaveManager.WaterCell> cells = WaterWaveManager.getWaterCells();
                  List<WaterWaveManager.Wave> waves = WaterWaveManager.getWaves();
                  if (cells.isEmpty() && waves.isEmpty()) {
                      return;
                  }

                  PoseStack poseStack = event.getPoseStack();
                  Vec3 camPos = event.getCamera().getPosition();
                  float partialTick = event.getPartialTick();
                  float time = (level.getGameTime() + partialTick) * 0.085f;

                  long dayTime = level.getDayTime() % 24000L;
                  float shimmerR = 0.85f;
                  float shimmerG = 0.96f;
                  float shimmerB = 1.0f;
                  float shimmerStrength = 1.0f;

                  if ((dayTime >= 11800 && dayTime <= 13600) || (dayTime >= 22400)) {
                      shimmerR = 1.0f;
                      shimmerG = 0.72f;
                      shimmerB = 0.42f;
                      shimmerStrength = 0.95f;
                  } else if (dayTime > 13600 && dayTime < 22400) {
                      shimmerR = 0.55f;
                      shimmerG = 0.72f;
                      shimmerB = 0.95f;
                      shimmerStrength = 0.55f;
                  }
                  if (level.isRaining()) {
                      shimmerStrength *= 0.45f;
                  }

                  poseStack.pushPose();
                  poseStack.translate(-camPos.x, -camPos.y, -camPos.z);
                  Matrix4f matrix = poseStack.last().pose();

                  RenderSystem.enableBlend();
                  RenderSystem.defaultBlendFunc();
                  RenderSystem.enableDepthTest();
                  RenderSystem.depthMask(false);
                  RenderSystem.disableCull();
                  RenderSystem.setShader(GameRenderer::getPositionColorShader);

                  Tesselator tesselator = Tesselator.getInstance();
                  BufferBuilder buffer = tesselator.getBuilder();
                  buffer.begin(VertexFormat.Mode.QUADS, DefaultVertexFormat.POSITION_COLOR);

                  for (int i = 0; i < cells.size(); i++) {
                      renderWaterCell(buffer, matrix, cells.get(i), time, partialTick, shimmerR, shimmerG, shimmerB, shimmerStrength);
                  }

                  for (int i = 0; i < waves.size(); i++) {
                      renderDynamicWave(buffer, matrix, level, waves.get(i), partialTick);
                  }

                  tesselator.end();

                  RenderSystem.depthMask(true);
                  RenderSystem.enableCull();
                  RenderSystem.disableBlend();
                  poseStack.popPose();
              }

              private static void renderWaterCell(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      WaterWaveManager.WaterCell cell,
                      float time,
                      float partialTick,
                      float shimmerR,
                      float shimmerG,
                      float shimmerB,
                      float shimmerStrength
              ) {
                  float x0 = cell.x;
                  float x1 = cell.x + 1.0f;
                  float z0 = cell.z;
                  float z1 = cell.z + 1.0f;
                  float baseY = cell.surfaceY + 0.048f;

                  float h00 = getAmbientWaveHeight(x0, z0, time) + WaterWaveManager.getWaveDisplacementAt(x0, z0, partialTick);
                  float h10 = getAmbientWaveHeight(x1, z0, time) + WaterWaveManager.getWaveDisplacementAt(x1, z0, partialTick);
                  float h11 = getAmbientWaveHeight(x1, z1, time) + WaterWaveManager.getWaveDisplacementAt(x1, z1, partialTick);
                  float h01 = getAmbientWaveHeight(x0, z1, time) + WaterWaveManager.getWaveDisplacementAt(x0, z1, partialTick);

                  emitWaterVertex(buffer, matrix, x0, baseY + h00, z0, h00, shimmerR, shimmerG, shimmerB, shimmerStrength);
                  emitWaterVertex(buffer, matrix, x1, baseY + h10, z0, h10, shimmerR, shimmerG, shimmerB, shimmerStrength);
                  emitWaterVertex(buffer, matrix, x1, baseY + h11, z1, h11, shimmerR, shimmerG, shimmerB, shimmerStrength);
                  emitWaterVertex(buffer, matrix, x0, baseY + h01, z1, h01, shimmerR, shimmerG, shimmerB, shimmerStrength);

                  if (cell.shoreMask != 0) {
                      float foamWave = 0.14f + 0.07f * (float) Math.sin(time * 1.6f + cell.x * 0.8f + cell.z * 0.8f);
                      float foamY = baseY + 0.025f;
                      float foamAlpha = 0.36f + 0.14f * (float) Math.sin(time * 2.1f + cell.x + cell.z);

                      if ((cell.shoreMask & 1) != 0) {
                          drawFoamStrip(buffer, matrix, x0, z0, x1, z0, x1, z0 + foamWave, x0, z0 + foamWave, foamY, foamAlpha);
                      }
                      if ((cell.shoreMask & 2) != 0) {
                          drawFoamStrip(buffer, matrix, x0, z1, x1, z1, x1, z1 - foamWave, x0, z1 - foamWave, foamY, foamAlpha);
                      }
                      if ((cell.shoreMask & 4) != 0) {
                          drawFoamStrip(buffer, matrix, x1, z0, x1, z1, x1 - foamWave, z1, x1 - foamWave, z0, foamY, foamAlpha);
                      }
                      if ((cell.shoreMask & 8) != 0) {
                          drawFoamStrip(buffer, matrix, x0, z0, x0, z1, x0 + foamWave, z1, x0 + foamWave, z0, foamY, foamAlpha);
                      }
                  }
              }

              private static void emitWaterVertex(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      float x,
                      float y,
                      float z,
                      float height,
                      float shimmerR,
                      float shimmerG,
                      float shimmerB,
                      float shimmerStrength
              ) {
                  float crest = Mth.clamp((height + 0.02f) * 8.5f, 0.0f, 1.0f);
                  float r = Mth.lerp(crest, 0.08f, shimmerR);
                  float g = Mth.lerp(crest, 0.28f, shimmerG);
                  float b = Mth.lerp(crest, 0.52f, shimmerB);
                  float a = Mth.lerp(crest, 0.07f, 0.26f * shimmerStrength + 0.08f);

                  buffer.vertex(matrix, x, y, z).color(r, g, b, a).endVertex();
              }

              private static void drawFoamStrip(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      float ax, float az,
                      float bx, float bz,
                      float cx, float cz,
                      float dx, float dz,
                      float y,
                      float alpha
              ) {
                  buffer.vertex(matrix, ax, y + 0.01f, az).color(0.92f, 0.97f, 1.0f, alpha).endVertex();
                  buffer.vertex(matrix, bx, y + 0.01f, bz).color(0.92f, 0.97f, 1.0f, alpha).endVertex();
                  buffer.vertex(matrix, cx, y, cz).color(0.82f, 0.94f, 1.0f, 0.0f).endVertex();
                  buffer.vertex(matrix, dx, y, dz).color(0.82f, 0.94f, 1.0f, 0.0f).endVertex();
              }

              private static void renderDynamicWave(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      ClientLevel level,
                      WaterWaveManager.Wave wave,
                      float partialTick
              ) {
                  float progress = wave.getProgress(partialTick);
                  float fadeIn = Mth.clamp((wave.age + partialTick) / 3.0f, 0.0f, 1.0f);
                  float fadeOut = (1.0f - progress) * (1.0f - progress);
                  float alpha = fadeIn * fadeOut * (wave.foamRing ? 0.62f : 0.35f) * Mth.clamp(wave.strength, 0.25f, 1.3f);

                  if (alpha <= 0.01f) {
                      return;
                  }

                  float radius = wave.getInterpolatedRadius(partialTick);
                  float halfWidth = (wave.foamRing ? 0.16f : 0.08f) * (1.0f + progress * 0.8f);
                  float innerR = Math.max(0.02f, radius - halfWidth);
                  float outerR = radius + halfWidth;

                  float baseY = (float) wave.y + 0.055f;
                  float crestHeight = (wave.foamRing ? 0.095f : 0.025f) * wave.strength * fadeOut;

                  float crestR = wave.foamRing ? 0.94f : 0.78f;
                  float crestG = wave.foamRing ? 0.98f : 0.93f;
                  float crestB = 1.0f;

                  for (int s = 0; s < RING_SEGMENTS; s++) {
                      double a0 = (s / (double) RING_SEGMENTS) * Math.PI * 2.0;
                      double a1 = ((s + 1) / (double) RING_SEGMENTS) * Math.PI * 2.0;

                      float cos0 = (float) Math.cos(a0);
                      float sin0 = (float) Math.sin(a0);
                      float cos1 = (float) Math.cos(a1);
                      float sin1 = (float) Math.sin(a1);

                      double midX = wave.x + ((cos0 + cos1) * 0.5) * radius;
                      double midZ = wave.z + ((sin0 + sin1) * 0.5) * radius;

                      if (!WaterWaveManager.isWaterAt(level, midX, wave.y, midZ)) {
                          continue;
                      }

                      float inX0 = (float) wave.x + cos0 * innerR;
                      float inZ0 = (float) wave.z + sin0 * innerR;
                      float inX1 = (float) wave.x + cos1 * innerR;
                      float inZ1 = (float) wave.z + sin1 * innerR;

                      float midX0 = (float) wave.x + cos0 * radius;
                      float midZ0 = (float) wave.z + sin0 * radius;
                      float midX1 = (float) wave.x + cos1 * radius;
                      float midZ1 = (float) wave.z + sin1 * radius;

                      float outX0 = (float) wave.x + cos0 * outerR;
                      float outZ0 = (float) wave.z + sin0 * outerR;
                      float outX1 = (float) wave.x + cos1 * outerR;
                      float outZ1 = (float) wave.z + sin1 * outerR;

                      buffer.vertex(matrix, inX0, baseY, inZ0).color(0.45f, 0.80f, 0.98f, 0.0f).endVertex();
                      buffer.vertex(matrix, inX1, baseY, inZ1).color(0.45f, 0.80f, 0.98f, 0.0f).endVertex();
                      buffer.vertex(matrix, midX1, baseY + crestHeight, midZ1).color(crestR, crestG, crestB, alpha).endVertex();
                      buffer.vertex(matrix, midX0, baseY + crestHeight, midZ0).color(crestR, crestG, crestB, alpha).endVertex();

                      buffer.vertex(matrix, midX0, baseY + crestHeight, midZ0).color(crestR, crestG, crestB, alpha).endVertex();
                      buffer.vertex(matrix, midX1, baseY + crestHeight, midZ1).color(crestR, crestG, crestB, alpha).endVertex();
                      buffer.vertex(matrix, outX1, baseY, outZ1).color(0.50f, 0.85f, 1.0f, 0.0f).endVertex();
                      buffer.vertex(matrix, outX0, baseY, outZ0).color(0.50f, 0.85f, 1.0f, 0.0f).endVertex();
                  }
              }

              private static float getAmbientWaveHeight(double wx, double wz, float time) {
                  double w1 = Math.sin(wx * 0.65 + time * 1.15) * 0.017;
                  double w2 = Math.cos(wz * 0.75 + time * 0.95) * 0.014;
                  double w3 = Math.sin((wx + wz) * 0.45 - time * 1.4) * 0.011;
                  return (float) (w1 + w2 + w3);
              }
          }
          END_RENDERER

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar Mod
        run: gradle build

      - name: Salvar Mod Pronto (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: AguaRealista-1.20.1-Forge
          path: build/libs/*.jar
