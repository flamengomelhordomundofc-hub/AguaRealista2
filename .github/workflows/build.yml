              private static float sampleTotalHeight(int gx, int gz, float openness, float time, float partialTick) {
                  double wx = (WaterSimulation.originBlockX - WaterSimulation.BLOCK_RADIUS) + gx * WaterSimulation.STEP;
                  double wz = (WaterSimulation.originBlockZ - WaterSimulation.BLOCK_RADIUS) + gz * WaterSimulation.STEP;
                  float simH = WaterSimulation.getSimHeight(gx, gz, partialTick);
                  float ambH = WaterSimulation.getAmbientWave(wx, wz, time) * openness;
                  int idx = WaterSimulation.nodeIdx(gx, gz);
                  if (WaterSimulation.isBoundaryNode[idx]) {
                      ambH *= 0.35f;
                  }
                  return Mth.clamp(simH + ambH, -0.042f, 0.38f);
              }

              private static void emitWaterSurfaceVertex(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      WaterSimulation.WaterColumn col,
                      int gx, int gz,
                      Vec3 camPos,
                      float time,
                      float partialTick,
                      float lx, float ly, float lz,
                      float specR, float specG, float specB, float specMult,
                      float skyR, float skyG, float skyB,
                      float dayFactor
              ) {
                  float wx = (WaterSimulation.originBlockX - WaterSimulation.BLOCK_RADIUS) + gx * WaterSimulation.STEP;
                  float wz = (WaterSimulation.originBlockZ - WaterSimulation.BLOCK_RADIUS) + gz * WaterSimulation.STEP;

                  float hC = sampleTotalHeight(gx, gz, col.openness, time, partialTick);
                  float wy = col.surfaceY + 0.055f + hC;

                  // Normal 3D real da superficie para iluminacao e reflexo
                  int gxL = Math.max(0, gx - 1);
                  int gxR = Math.min(WaterSimulation.N - 1, gx + 1);
                  int gzD = Math.max(0, gz - 1);
                  int gzU = Math.min(WaterSimulation.N - 1, gz + 1);

                  float hL = sampleTotalHeight(gxL, gz, col.openness, time, partialTick);
                  float hR = sampleTotalHeight(gxR, gz, col.openness, time, partialTick);
                  float hD = sampleTotalHeight(gx, gzD, col.openness, time, partialTick);
                  float hU = sampleTotalHeight(gx, gzU, col.openness, time, partialTick);

                  float slopeBoost = 2.15f;
                  float nx = (hL - hR) * slopeBoost;
                  float nz = (hD - hU) * slopeBoost;
                  float ny = 2.0f * WaterSimulation.STEP;
                  float nLen = (float) Math.sqrt(nx * nx + ny * ny + nz * nz);
                  nx /= nLen;
                  ny /= nLen;
                  nz /= nLen;

                  // Vetor da camera e efeito Fresnel real
                  float vx = (float) camPos.x - wx;
                  float vy = (float) camPos.y - wy;
                  float vz = (float) camPos.z - wz;
                  float distSqXZ = vx * vx + vz * vz;
                  float vLen = (float) Math.sqrt(vx * vx + vy * vy + vz * vz);
                  if (vLen < 0.001f) vLen = 0.001f;
                  vx /= vLen;
                  vy /= vLen;
                  vz /= vLen;

                  float nDotV = Math.abs(nx * vx + ny * vy + nz * vz);
                  float fresnel = 0.07f + 0.93f * (float) Math.pow(1.0f - Mth.clamp(nDotV, 0.0f, 1.0f), 3.0);

                  // Absorcao de cor pela profundidade (raso = turquesa cristalino, fundo = azul profundo)
                  float depthT = Mth.clamp((col.depth - 1.0f) / 6.5f, 0.0f, 1.0f);
                  float shallowR = Mth.lerp(0.55f, col.biomeR, 0.16f);
                  float shallowG = Mth.lerp(0.55f, col.biomeG, 0.84f);
                  float shallowB = Mth.lerp(0.55f, col.biomeB, 0.88f);

                  float deepR = col.biomeR * 0.11f;
                  float deepG = col.biomeG * 0.28f;
                  float deepB = col.biomeB * 0.52f;

                  float bodyR = Mth.lerp(depthT, shallowR, deepR);
                  float bodyG = Mth.lerp(depthT, shallowG, deepG);
                  float bodyB = Mth.lerp(depthT, shallowB, deepB);

                  // Iluminacao real (ceu + tochas/lanternas)
                  float lightFactor = Math.max(col.skyLight * dayFactor, col.blockLight * 0.85f);
                  lightFactor = Mth.clamp(lightFactor, 0.08f, 1.0f);

                  // Mistura cor do corpo da agua com reflexo do ceu pelo Fresnel
                  float reflStrength = fresnel * col.skyLight * 0.88f;
                  float r = Mth.lerp(reflStrength, bodyR * lightFactor, skyR);
                  float g = Mth.lerp(reflStrength, bodyG * lightFactor, skyG);
                  float b = Mth.lerp(reflStrength, bodyB * lightFactor, skyB);

                  // Luz quente de tochas proximas
                  if (col.blockLight > 0.15f) {
                      float torch = col.blockLight * 0.22f;
                      r += torch * 1.0f;
                      g += torch * 0.72f;
                      b += torch * 0.35f;
                  }

                  // Brilho especular Blinn-Phong do Sol / Lua na inclinacao das ondas!
                  float hx = lx + vx;
                  float hy = ly + vy;
                  float hz = lz + vz;
                  float hLen = (float) Math.sqrt(hx * hx + hy * hy + hz * hz);
                  float specular = 0.0f;
                  if (hLen > 0.001f && col.skyLight > 0.2f) {
                      float nDotH = Math.max(0.0f, (nx * hx + ny * hy + nz * hz) / hLen);
                      float sharp = (float) Math.pow(nDotH, 46.0) * 1.35f;
                      float broad = (float) Math.pow(nDotH, 9.0) * 0.26f;
                      specular = (sharp + broad) * specMult * col.skyLight;
                      r += specular * specR;
                      g += specular * specG;
                      b += specular * specB;
                  }

                  // Espuma branca nas cristas das ondas e no rastro do jogador
                  float simFoam = WaterSimulation.getFoam(gx, gz, partialTick);
                  float crestFoam = Mth.clamp((hC - 0.068f) * 5.2f, 0.0f, 0.85f);
                  float totalFoam = Mth.clamp(simFoam + crestFoam, 0.0f, 1.0f);

                  float foamLight = Mth.clamp(lightFactor * 1.15f, 0.25f, 1.0f);
                  r = Mth.lerp(totalFoam, r, 0.94f * foamLight);
                  g = Mth.lerp(totalFoam, g, 0.98f * foamLight);
                  b = Mth.lerp(totalFoam, b, 1.00f * foamLight);

                  // Transparencia realista: raso + olhando de cima = cristalino; fundo/inclinado/espuma = mais opaco
                  float baseAlpha = Mth.lerp(depthT, 0.24f, 0.72f);
                  float alpha = Mth.clamp(baseAlpha + fresnel * 0.42f + totalFoam * 0.55f + specular * 0.45f, 0.16f, 0.93f);

                  // Fade suave na borda do raio de renderizacao para emendar invisivelmente com a agua distante
                  float dist = (float) Math.sqrt(distSqXZ);
                  float edgeFade = Mth.clamp((14.2f - dist) / 3.2f, 0.0f, 1.0f);
                  alpha *= edgeFade;

                  buffer.vertex(matrix, wx, wy, wz)
                          .color(Mth.clamp(r, 0.0f, 1.0f), Mth.clamp(g, 0.0f, 1.0f), Mth.clamp(b, 0.0f, 1.0f), alpha)
                          .endVertex();
              }

              private static void renderShoreFoam(
                      BufferBuilder buffer,
                      Matrix4f matrix,
                      WaterSimulation.WaterColumn col,
                      int baseGX, int baseGZ,
                      Vec3 camPos,
                      float time,
                      float partialTick,
                      float dayFactor
              ) {
                  float dx = (col.worldX + 0.5f) - (float) camPos.x;
                  float dz = (col.worldZ + 0.5f) - (float) camPos.z;
                  float dist = (float) Math.sqrt(dx * dx + dz * dz);
                  float edgeFade = Mth.clamp((13.5f - dist) / 2.8f, 0.0f, 1.0f);
                  if (edgeFade <= 0.02f) return;

                  float centerH = sampleTotalHeight(baseGX + 1, baseGZ + 1, col.openness, time, partialTick);
                  float wavePush = 0.17f + 0.08f * (float) Math.sin(time * 1.45f + col.worldX * 0.7f + col.worldZ * 0.7f) + Math.max(0.0f, centerH * 1.2f);
                  float y = col.surfaceY + 0.068f + Math.max(0.0f, centerH * 0.65f);

                  float light = Mth.clamp(Math.max(col.skyLight * dayFactor, col.blockLight) * 1.1f, 0.25f, 1.0f);
                  float alpha = (0.48f + 0.18f * (float) Math.sin(time * 2.0f + col.worldX + col.worldZ)) * edgeFade;

                  float x0 = col.worldX;
                  float x1 = col.worldX + 1.0f;
                  float z0 = col.worldZ;
                  float z1 = col.worldZ + 1.0f;

                  if ((col.shoreMask & 1) != 0) {
                      drawShoreQuad(buffer, matrix, x0, z0, x1, z0, x1, z0 + wavePush, x0, z0 + wavePush, y, light, alpha);
                  }
                  if ((col.shoreMask & 2) != 0) {
                      drawShoreQuad(buffer, matrix, x0, z1, x1, z1, x1, z1 - wavePush, x0, z1 - wavePush, y, light, alpha);
                  }
                  if ((col.shoreMask & 4) != 0) {
                      drawShoreQuad(buffer, matrix, x1, z0, x1, z1, x1 - wavePush, z1, x1 - wavePush, z0, y, light, alpha);
                  }
                  if ((col.shoreMask & 8) != 0) {
                      drawShoreQuad(buffer, matrix, x0, z0, x0, z1, x0 + wavePush, z1, x0 + wavePush, z0, y, light, alpha);
                  }
              }

              private static void drawShoreQuad(
                      BufferBuilder buffer, Matrix4f matrix,
                      float ax, float az, float bx, float bz,
                      float cx, float cz, float dx, float dz,
                      float y, float light, float alpha
              ) {
                  buffer.vertex(matrix, ax, y + 0.015f, az).color(0.92f * light, 0.97f * light, 1.0f * light, alpha).endVertex();
                  buffer.vertex(matrix, bx, y + 0.015f, bz).color(0.92f * light, 0.97f * light, 1.0f * light, alpha).endVertex();
                  buffer.vertex(matrix, cx, y, cz).color(0.78f * light, 0.94f * light, 1.0f * light, 0.0f).endVertex();
                  buffer.vertex(matrix, dx, y, dz).color(0.78f * light, 0.94f * light, 1.0f * light, 0.0f).endVertex();
              }
          }
          END_RENDERER

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar Mod v2.0
        run: gradle build

      - name: Salvar Mod Pronto (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: AguaRealista-v2-1.20.1-Forge
          path: build/libs/*.jar
