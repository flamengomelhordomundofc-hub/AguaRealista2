name: Compilar Mod Agua Realista v2.0 (1.20.1)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gerar texturas cristalinas de agua (sem pixels feios)
        run: |
          python3 - << 'END_PY'
          import math, os, struct, zlib

          os.makedirs('src/main/resources/assets/minecraft/textures/block', exist_ok=True)

          def write_png(path, width, height, rgba):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              stride = width * 4
              for y in range(height):
                  raw.append(0)
                  raw.extend(rgba[y * stride:(y + 1) * stride])
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), 6)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          # water_still.png: 32x32 x 16 frames (agua lisa, cristalina e sem quadrados)
          w, frames = 32, 16
          buf = bytearray(w * w * frames * 4)
          for fr in range(frames):
              t = (fr / frames) * math.tau
              for y in range(w):
                  ny = (y / w) * math.tau
                  for x in range(w):
                      nx = (x / w) * math.tau
                      v1 = math.sin(nx + t) * math.cos(ny - t)
                      v2 = math.sin(nx * 2.0 - ny + t * 2.0) * 0.5
                      v3 = math.cos(nx + ny * 2.0 - t) * 0.35
                      val = (v1 + v2 + v3) / 1.85
                      bright = int(max(195, min(255, 228 + val * 26)))
                      alpha = int(max(42, min(105, 68 + val * 20)))
                      idx = ((fr * w + y) * w + x) * 4
                      buf[idx] = bright
                      buf[idx + 1] = bright
                      buf[idx + 2] = 255
                      buf[idx + 3] = alpha
          write_png('src/main/resources/assets/minecraft/textures/block/water_still.png', w, w * frames, buf)

          # water_flow.png: 64x64 x 16 frames (correnteza lisa e suave)
          w, frames = 64, 16
          buf = bytearray(w * w * frames * 4)
          for fr in range(frames):
              t = (fr / frames) * math.tau
              for y in range(w):
                  ny = (y / w) * math.tau
                  for x in range(w):
                      nx = (x / w) * math.tau
                      v1 = math.sin(nx * 2.0 + math.sin(ny - t) * 0.8)
                      v2 = math.cos(ny * 2.0 - t * 2.0 + math.cos(nx) * 0.6) * 0.6
                      val = (v1 + v2) / 1.6
                      bright = int(max(200, min(255, 232 + val * 22)))
                      alpha = int(max(55, min(125, 86 + val * 22)))
                      idx = ((fr * w + y) * w + x) * 4
                      buf[idx] = bright
                      buf[idx + 1] = bright
                      buf[idx + 2] = 255
                      buf[idx + 3] = alpha
          write_png('src/main/resources/assets/minecraft/textures/block/water_flow.png', w, w * frames, buf)
          END_PY

          cat << 'END_MCMETA1' > src/main/resources/assets/minecraft/textures/block/water_still.png.mcmeta
          {
            "animation": {
              "frametime": 2,
              "interpolate": true
            }
          }
          END_MCMETA1

          cat << 'END_MCMETA2' > src/main/resources/assets/minecraft/textures/block/water_flow.png.mcmeta
          {
            "animation": {
              "frametime": 2,
              "interpolate": true
            }
          }
          END_MCMETA2

      - name: Gerar codigo Java do mod v2.0
        run: |
          mkdir -p src/main/resources/META-INF src/main/java/com/aguarealista/client

          cat << 'END_SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }

          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
          }

          rootProject.name = 'aguarealista'
          END_SETTINGS

          cat << 'END_GRADLE' > build.gradle
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '2.0.0'
          group = 'com.aguarealista'

          base {
              archivesName = 'aguarealista-v2-1.20.1'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                          "Specification-Title"     : "aguarealista",
                          "Specification-Vendor"    : "AguaRealista",
                          "Specification-Version"   : "2",
                          "Implementation-Title"    : project.name,
                          "Implementation-Version"  : project.version,
                          "Implementation-Vendor"   : "AguaRealista"
                  ])
              }
              finalizedBy 'reobfJar'
          }
          END_GRADLE

          cat << 'END_META' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "Agua Realista v2 Ultra Resources",
              "pack_format": 15
            }
          }
          END_META

          cat << 'END_TOML' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="aguarealista"
          version="2.0.0"
          displayName="Agua Realista Ultra v2"
          description='''
          Simulacao fisica real de ondas 2D/3D em alta resolucao, reflexo Fresnel do ceu e sol, profundidade real, causticas subaquaticas e espuma dinamica sem shaders.
          '''

          [[dependencies.aguarealista]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.aguarealista]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          END_TOML

          cat << 'END_MOD' > src/main/java/com/aguarealista/AguaRealistaMod.java
          package com.aguarealista;

          import net.minecraftforge.fml.common.Mod;

          @Mod(AguaRealistaMod.MODID)
          public class AguaRealistaMod {
              public static final String MODID = "aguarealista";

              public AguaRealistaMod() {
              }
          }
          END_MOD

          cat << 'END_PHYSICS' > src/main/java/com/aguarealista/WaterPhysicsHandler.java
          package com.aguarealista;

          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.item.ItemEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.vehicle.Boat;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = AguaRealistaMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE)
          public class WaterPhysicsHandler {

              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }

                  Player player = event.player;
                  Level level = player.level();
                  if (level.isClientSide() || !player.isInWater()) {
                      return;
                  }

                  Vec3 motion = player.getDeltaMovement();
                  double horizSpeed = Math.sqrt(motion.x * motion.x + motion.z * motion.z);
                  double vertSpeed = Math.abs(motion.y);

                  if (horizSpeed < 0.05 && vertSpeed < 0.12) {
                      return;
                  }

                  AABB area = player.getBoundingBox().inflate(4.5, 2.0, 4.5);
                  for (Entity target : level.getEntities(player, area)) {
                      if (!target.isInWater()) {
                          continue;
                      }
                      if (!(target instanceof ItemEntity || target instanceof Boat || target instanceof LivingEntity)) {
                          continue;
                      }

                      double dx = target.getX() - player.getX();
                      double dz = target.getZ() - player.getZ();
                      double dist = Math.sqrt(dx * dx + dz * dz);

                      if (dist > 0.12 && dist < 4.5) {
                          double falloff = 1.0 - (dist / 4.5);
                          double force = falloff * Math.min(0.12, horizSpeed * 0.28 + vertSpeed * 0.22);
                          if (target instanceof ItemEntity) {
                              force *= 2.0;
                          } else if (target instanceof Boat) {
                              force *= 0.85;
                          }

                          target.push((dx / dist) * force, 0.012 * force, (dz / dist) * force);
                      }
                  }
              }
          }
          END_PHYSICS

          cat << 'END_SIM' > src/main/java/com/aguarealista/client/WaterSimulation.java
          package com.aguarealista.client;

          import com.aguarealista.AguaRealistaMod;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.renderer.BiomeColors;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.item.ItemEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.vehicle.Boat;
          import net.minecraft.world.level.LightLayer;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Random;

          @Mod.EventBusSubscriber(modid = AguaRealistaMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class WaterSimulation {

              public static final int BLOCK_RADIUS = 14;
              public static final int GRID_BLOCKS = BLOCK_RADIUS * 2 + 1; // 29x29 blocos
              public static final int SUB = 3; // 3x3 subdivisoes por bloco (alta resolucao!)
              public static final float STEP = 1.0f / SUB;
              public static final int N = GRID_BLOCKS * SUB + 1; // 88x88 vertices

              public static class WaterColumn {
                  public boolean hasWater;
                  public int worldX;
                  public int worldY;
                  public int worldZ;
                  public float surfaceY;
                  public int depth;
                  public int floorY;
                  public int shoreMask;
                  public float openness;
                  public boolean skyVisible;
                  public float skyLight;
                  public float blockLight;
                  public float biomeR;
                  public float biomeG;
                  public float biomeB;
              }

              public static final WaterColumn[] COLUMNS = new WaterColumn[GRID_BLOCKS * GRID_BLOCKS];
              public static final float[] curr = new float[N * N];
              public static final float[] prev = new float[N * N];
              public static final float[] next = new float[N * N];
              public static final float[] renderPrev = new float[N * N];

              public static final float[] foam = new float[N * N];
              public static final float[] foamPrev = new float[N * N];

              public static final boolean[] isWaterNode = new boolean[N * N];
              public static final boolean[] isBoundaryNode = new boolean[N * N];

              private static final float[] tmpA = new float[N * N];
              private static final float[] tmpB = new float[N * N];
              private static final float[] tmpC = new float[N * N];

              private static final Map<Integer, Boolean> WAS_IN_WATER = new HashMap<>();
              private static final Random RANDOM = new Random();

              public static int originBlockX = 0;
              public static int originBlockZ = 0;
              public static boolean initialized = false;
              public static boolean hasAnyWater = false;
              private static int tickCounter = 0;

              static {
                  for (int i = 0; i < COLUMNS.length; i++) {
                      COLUMNS[i] = new WaterColumn();
                  }
              }

              public static int colIdx(int bx, int bz) {
                  return bz * GRID_BLOCKS + bx;
              }

              public static int nodeIdx(int gx, int gz) {
                  return gz * N + gx;
              }

              public static float getSimHeight(int gx, int gz, float partialTick) {
                  int idx = nodeIdx(gx, gz);
                  return Mth.lerp(partialTick, renderPrev[idx], curr[idx]);
              }

              public static float getFoam(int gx, int gz, float partialTick) {
                  int idx = nodeIdx(gx, gz);
                  return Mth.lerp(partialTick, foamPrev[idx], foam[idx]);
              }

              public static float getAmbientWave(double wx, double wz, float time) {
                  double w1 = Math.sin(wx * 0.52 + wz * 0.28 + time * 1.15) * 0.024;
                  double w2 = Math.cos(wx * 0.34 - wz * 0.68 + time * 0.92) * 0.020;
                  double w3 = Math.sin(wx * 1.05 + wz * 0.85 - time * 1.55) * 0.011;
                  double w4 = Math.cos(wx * 1.65 - wz * 1.45 + time * 2.10) * 0.006;
                  return (float) (w1 + w2 + w3 + w4);
              }

              public static void reset() {
                  Arrays.fill(curr, 0.0f);
                  Arrays.fill(prev, 0.0f);
                  Arrays.fill(next, 0.0f);
                  Arrays.fill(renderPrev, 0.0f);
                  Arrays.fill(foam, 0.0f);
                  Arrays.fill(foamPrev, 0.0f);
                  Arrays.fill(isWaterNode, false);
                  Arrays.fill(isBoundaryNode, false);
                  WAS_IN_WATER.clear();
                  initialized = false;
                  hasAnyWater = false;
              }

              @SubscribeEvent
              public static void onClientTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }

                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  Player player = mc.player;

                  if (level == null || player == null) {
                      if (initialized) {
                          reset();
                      }
                      return;
                  }

                  if (mc.isPaused()) {
                      return;
                  }

                  tickCounter++;

                  int px = Mth.floor(player.getX());
                  int pz = Mth.floor(player.getZ());

                  if (!initialized || Math.abs(px - originBlockX) > BLOCK_RADIUS || Math.abs(pz - originBlockZ) > BLOCK_RADIUS) {
                      reset();
                      originBlockX = px;
                      originBlockZ = pz;
                      initialized = true;
                      scanWaterWorld(level, player);
                  } else if (px != originBlockX || pz != originBlockZ) {
                      shiftSimulationGrid(px - originBlockX, pz - originBlockZ);
                      originBlockX = px;
                      originBlockZ = pz;
                      scanWaterWorld(level, player);
                  } else if (tickCounter % 5 == 0) {
                      scanWaterWorld(level, player);
                  }

                  if (!hasAnyWater) {
                      return;
                  }

                  // Salva estado anterior para interpolacao super lisa a 60+ FPS
                  System.arraycopy(curr, 0, renderPrev, 0, curr.length);
                  System.arraycopy(foam, 0, foamPrev, 0, foam.length);

                  // Aplica perturbacoes reais de jogadores, mobs, barcos, itens e chuva
                  applyEntityDisturbances(level, player);
                  applyRainDisturbances(level);

                  // Roda a equacao fisica real de ondas 2D (2 subpassos por tick para fluidez real)
                  stepWaveEquation();
                  stepWaveEquation();
                  updateFoam();

                  if (tickCounter % 200 == 0 && WAS_IN_WATER.size() > 160) {
                      WAS_IN_WATER.clear();
                  }
              }

              private static void shiftSimulationGrid(int shiftBlocksX, int shiftBlocksZ) {
                  int shiftGX = shiftBlocksX * SUB;
                  int shiftGZ = shiftBlocksZ * SUB;

                  Arrays.fill(tmpA, 0.0f);
                  Arrays.fill(tmpB, 0.0f);
                  Arrays.fill(tmpC, 0.0f);

                  for (int gz = 0; gz < N; gz++) {
                      int oldGZ = gz + shiftGZ;
                      if (oldGZ < 0 || oldGZ >= N) continue;
                      int rowNew = gz * N;
                      int rowOld = oldGZ * N;
                      for (int gx = 0; gx < N; gx++) {
                          int oldGX = gx + shiftGX;
                          if (oldGX < 0 || oldGX >= N) continue;
                          tmpA[rowNew + gx] = curr[rowOld + oldGX];
                          tmpB[rowNew + gx] = prev[rowOld + oldGX];
                          tmpC[rowNew + gx] = foam[rowOld + oldGX];
                      }
                  }

                  System.arraycopy(tmpA, 0, curr, 0, curr.length);
                  System.arraycopy(tmpB, 0, prev, 0, prev.length);
                  System.arraycopy(tmpC, 0, foam, 0, foam.length);
                  System.arraycopy(tmpA, 0, renderPrev, 0, renderPrev.length);
                  System.arraycopy(tmpC, 0, foamPrev, 0, foamPrev.length);
              }

              private static void scanWaterWorld(ClientLevel level, Player player) {
                  int baseX = originBlockX - BLOCK_RADIUS;
                  int baseZ = originBlockZ - BLOCK_RADIUS;
                  int py = Mth.floor(player.getY());

                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  BlockPos.MutableBlockPos check = new BlockPos.MutableBlockPos();

                  hasAnyWater = false;

                  for (int bz = 0; bz < GRID_BLOCKS; bz++) {
                      int wz = baseZ + bz;
                      for (int bx = 0; bx < GRID_BLOCKS; bx++) {
                          int wx = baseX + bx;
                          WaterColumn col = COLUMNS[colIdx(bx, bz)];
                          col.hasWater = false;
                          col.worldX = wx;
                          col.worldZ = wz;

                          int dx = bx - BLOCK_RADIUS;
                          int dz = bz - BLOCK_RADIUS;
                          if (dx * dx + dz * dz > (BLOCK_RADIUS + 1) * (BLOCK_RADIUS + 1)) {
                              continue;
                          }

                          for (int dy = 6; dy >= -7; dy--) {
                              int wy = py + dy;
                              pos.set(wx, wy, wz);
                              FluidState fluid = level.getFluidState(pos);
                              if (!fluid.is(FluidTags.WATER)) {
                                  continue;
                              }
                              check.set(wx, wy + 1, wz);
                              if (level.getFluidState(check).is(FluidTags.WATER)) {
                                  continue;
                              }

                              col.hasWater = true;
                              col.worldY = wy;
                              col.surfaceY = wy + fluid.getHeight(level, pos);
                              hasAnyWater = true;

                              // Mede a profundidade real ate o fundo do rio/mar (1..10 blocos)
                              int depth = 1;
                              int floorY = wy - 1;
                              for (int d = 1; d <= 9; d++) {
                                  check.set(wx, wy - d, wz);
                                  if (level.getFluidState(check).is(FluidTags.WATER)) {
                                      depth++;
                                      floorY = wy - d - 1;
                                  } else {
                                      floorY = wy - d;
                                      break;
                                  }
                              }
                              col.depth = depth;
                              col.floorY = floorY;

                              int shoreMask = 0;
                              if (isSolidShore(level, check.set(wx, wy, wz - 1))) shoreMask |= 1;
                              if (isSolidShore(level, check.set(wx, wy, wz + 1))) shoreMask |= 2;
                              if (isSolidShore(level, check.set(wx + 1, wy, wz))) shoreMask |= 4;
                              if (isSolidShore(level, check.set(wx - 1, wy, wz))) shoreMask |= 8;
                              col.shoreMask = shoreMask;

                              check.set(wx, wy + 1, wz);
                              col.skyVisible = level.canSeeSky(check);
                              col.skyLight = level.getBrightness(LightLayer.SKY, check) / 15.0f;
                              col.blockLight = level.getBrightness(LightLayer.BLOCK, check) / 15.0f;

                              int color = BiomeColors.getAverageWaterColor(level, pos);
                              col.biomeR = ((color >> 16) & 255) / 255.0f;
                              col.biomeG = ((color >> 8) & 255) / 255.0f;
                              col.biomeB = (color & 255) / 255.0f;
                              break;
                          }
                      }
                  }

                  // Calcula abertura da agua (lagos/oceanos ondulam mais que pocinhas de 1 bloco)
                  for (int bz = 0; bz < GRID_BLOCKS; bz++) {
                      for (int bx = 0; bx < GRID_BLOCKS; bx++) {
                          WaterColumn col = COLUMNS[colIdx(bx, bz)];
                          if (!col.hasWater) continue;
                          int waterNeighbors = 0;
                          for (int oz = -2; oz <= 2; oz++) {
                              for (int ox = -2; ox <= 2; ox++) {
                                  int nx = bx + ox;
                                  int nz = bz + oz;
                                  if (nx >= 0 && nx < GRID_BLOCKS && nz >= 0 && nz < GRID_BLOCKS) {
                                      WaterColumn nc = COLUMNS[colIdx(nx, nz)];
                                      if (nc.hasWater && Math.abs(nc.surfaceY - col.surfaceY) < 0.25f) {
                                          waterNeighbors++;
                                      }
                                  }
                              }
                          }
                          col.openness = Mth.clamp((waterNeighbors - 3.0f) / 18.0f, 0.12f, 1.0f);
                      }
                  }

                  // Atualiza mascara de vertices de agua e bordas refletoras
                  Arrays.fill(isWaterNode, false);
                  Arrays.fill(isBoundaryNode, false);

                  for (int gz = 0; gz < N; gz++) {
                      int bzA = Math.min(GRID_BLOCKS - 1, gz / SUB);
                      int bzB = (gz % SUB == 0 && gz > 0) ? bzA - 1 : bzA;
                      for (int gx = 0; gx < N; gx++) {
                          int bxA = Math.min(GRID_BLOCKS - 1, gx / SUB);
                          int bxB = (gx % SUB == 0 && gx > 0) ? bxA - 1 : bxA;

                          boolean anyWater = false;
                          boolean allSameWater = true;
                          float refY = Float.NaN;

                          for (int tz = bzB; tz <= bzA; tz++) {
                              for (int tx = bxB; tx <= bxA; tx++) {
                                  WaterColumn c = COLUMNS[colIdx(tx, tz)];
                                  if (c.hasWater) {
                                      anyWater = true;
                                      if (Float.isNaN(refY)) {
                                          refY = c.surfaceY;
                                      } else if (Math.abs(c.surfaceY - refY) > 0.22f) {
                                          allSameWater = false;
                                      }
                                  } else {
                                      allSameWater = false;
                                  }
                              }
                          }

                          int idx = nodeIdx(gx, gz);
                          isWaterNode[idx] = anyWater;
                          isBoundaryNode[idx] = anyWater && !allSameWater;
                          if (!anyWater) {
                              curr[idx] = 0.0f;
                              prev[idx] = 0.0f;
                              foam[idx] = 0.0f;
                          }
                      }
                  }
              }

              private static boolean isSolidShore(ClientLevel level, BlockPos pos) {
                  if (level.getFluidState(pos).is(FluidTags.WATER)) {
                      return false;
                  }
                  BlockState state = level.getBlockState(pos);
                  return !state.isAir() && !state.canBeReplaced();
              }

              private static void addSplashImpulse(double worldX, double worldZ, float radiusBlocks, float amplitude, float foamAmount) {
                  float cx = (float) ((worldX - (originBlockX - BLOCK_RADIUS)) * SUB);
                  float cz = (float) ((worldZ - (originBlockZ - BLOCK_RADIUS)) * SUB);
                  float rGrid = radiusBlocks * SUB;
                  int rInt = (int) Math.ceil(rGrid);

                  int minX = Math.max(1, (int) Math.floor(cx) - rInt);
                  int maxX = Math.min(N - 2, (int) Math.ceil(cx) + rInt);
                  int minZ = Math.max(1, (int) Math.floor(cz) - rInt);
                  int maxZ = Math.min(N - 2, (int) Math.ceil(cz) + rInt);

                  for (int gz = minZ; gz <= maxZ; gz++) {
                      float dz = gz - cz;
                      for (int gx = minX; gx <= maxX; gx++) {
                          int idx = nodeIdx(gx, gz);
                          if (!isWaterNode[idx]) continue;

                          float dx = gx - cx;
                          float dist = (float) Math.sqrt(dx * dx + dz * dz);
                          if (dist < rGrid) {
                              float t = dist / rGrid;
                              float weight = (float) Math.cos(t * Math.PI * 0.5);
                              weight = weight * weight;
                              curr[idx] = Mth.clamp(curr[idx] + amplitude * weight, -0.34f, 0.42f);
                              if (foamAmount > 0.0f) {
                                  foam[idx] = Math.min(1.0f, foam[idx] + foamAmount * weight);
                              }
                          }
                      }
                  }
              }

              private static void applyEntityDisturbances(ClientLevel level, Player localPlayer) {
                  AABB searchArea = localPlayer.getBoundingBox().inflate(BLOCK_RADIUS - 1.0, 7.0, BLOCK_RADIUS - 1.0);
                  List<Entity> entities = level.getEntitiesOfClass(Entity.class, searchArea);

                  for (Entity entity : entities) {
                      if (!(entity instanceof LivingEntity || entity instanceof Boat || entity instanceof ItemEntity)) {
                          continue;
                      }

                      boolean inWater = entity.isInWater();
                      boolean wasIn = WAS_IN_WATER.getOrDefault(entity.getId(), false);
                      WAS_IN_WATER.put(entity.getId(), inWater);

                      if (!inWater) {
                          continue;
                      }

                      double dx = entity.getX() - entity.xo;
                      double dy = entity.getY() - entity.yo;
                      double dz = entity.getZ() - entity.zo;
                      double horizSpeed = Math.sqrt(dx * dx + dz * dz);

                      // Pulo / queda na agua = cratera + anel de onda grande que rebate nas margens!
                      if (!wasIn) {
                          float impact = (float) Mth.clamp(Math.abs(dy) * 1.9 + 0.35, 0.35, 1.8);
                          addSplashImpulse(entity.getX(), entity.getZ(), 0.75f + impact * 0.35f, -0.24f * impact, 0.85f);
                          addSplashImpulse(entity.getX(), entity.getZ(), 1.35f + impact * 0.45f, 0.16f * impact, 0.55f);

                          int splashCount = (int) (10 + impact * 16);
                          for (int i = 0; i < splashCount; i++) {
                              double angle = RANDOM.nextDouble() * Math.PI * 2.0;
                              double sp = 0.05 + RANDOM.nextDouble() * 0.17 * impact;
                              level.addParticle(
                                      ParticleTypes.SPLASH,
                                      entity.getX() + Math.cos(angle) * 0.28,
                                      entity.getY() + 0.5,
                                      entity.getZ() + Math.sin(angle) * 0.28,
                                      Math.cos(angle) * sp,
                                      0.12 + RANDOM.nextDouble() * 0.20 * impact,
                                      Math.sin(angle) * sp
                              );
                          }
                          continue;
                      }

                      // Andando, correndo, nadando ou de barco -> cria proa positiva + esteira negativa em V!
                      if (horizSpeed > 0.02) {
                          float scale = entity instanceof Boat ? 1.55f : (entity instanceof ItemEntity ? 0.45f : 1.0f);
                          float power = (float) Math.min(1.35, horizSpeed * 4.5) * scale;

                          double dirX = dx / horizSpeed;
                          double dirZ = dz / horizSpeed;

                          // Onda levantando na frente do corpo/barco
                          addSplashImpulse(entity.getX() + dirX * 0.35, entity.getZ() + dirZ * 0.35, 0.72f * scale, 0.11f * power, 0.42f * power);
                          // Depressao/esteira logo atras
                          addSplashImpulse(entity.getX() - dirX * 0.38, entity.getZ() - dirZ * 0.38, 0.80f * scale, -0.095f * power, 0.55f * power);

                          if (horizSpeed > 0.08 && (tickCounter + entity.getId()) % 2 == 0) {
                              int pCount = horizSpeed > 0.16 ? 3 : 1;
                              for (int i = 0; i < pCount; i++) {
                                  double ox = (RANDOM.nextDouble() - 0.5) * 0.45;
                                  double oz = (RANDOM.nextDouble() - 0.5) * 0.45;
                                  level.addParticle(
                                          ParticleTypes.SPLASH,
                                          entity.getX() - dirX * 0.25 + ox,
                                          entity.getY() + 0.65,
                                          entity.getZ() - dirZ * 0.25 + oz,
                                          -dx * 0.45 + (RANDOM.nextDouble() - 0.5) * 0.06,
                                          0.07 + horizSpeed * 0.38,
                                          -dz * 0.45 + (RANDOM.nextDouble() - 0.5) * 0.06
                                  );
                                  if (RANDOM.nextFloat() < 0.4f) {
                                      level.addParticle(
                                              ParticleTypes.BUBBLE_POP,
                                              entity.getX() - dirX * 0.35 + ox,
                                              entity.getY() + 0.55,
                                              entity.getZ() - dirZ * 0.35 + oz,
                                              0.0, 0.02, 0.0
                                      );
                                  }
                              }
                          }

                          if (entity == localPlayer && horizSpeed > 0.10 && tickCounter % 11 == 0) {
                              level.playLocalSound(
                                      entity.getX(), entity.getY(), entity.getZ(),
                                      SoundEvents.GENERIC_SWIM,
                                      SoundSource.PLAYERS,
                                      0.20f,
                                      1.0f + RANDOM.nextFloat() * 0.35f,
                                      false
                              );
                          }
                      } else if ((tickCounter + entity.getId() * 5) % 14 == 0) {
                          // Ondulacao suave quando parado boiando na agua
                          float sign = ((tickCounter / 14) % 2 == 0) ? 1.0f : -1.0f;
                          addSplashImpulse(entity.getX(), entity.getZ(), 0.55f, 0.032f * sign, 0.08f);
                      }
                  }
              }

              private static void applyRainDisturbances(ClientLevel level) {
                  if (!level.isRaining()) {
                      return;
                  }

                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  for (int i = 0; i < 6; i++) {
                      int bx = 2 + RANDOM.nextInt(GRID_BLOCKS - 4);
                      int bz = 2 + RANDOM.nextInt(GRID_BLOCKS - 4);
                      WaterColumn col = COLUMNS[colIdx(bx, bz)];
                      if (!col.hasWater || !col.skyVisible) continue;
                      pos.set(col.worldX, col.worldY + 1, col.worldZ);
                      if (level.isRainingAt(pos)) {
                          addSplashImpulse(
                                  col.worldX + RANDOM.nextDouble(),
                                  col.worldZ + RANDOM.nextDouble(),
                                  0.38f,
                                  -0.065f,
                                  0.18f
                          );
                      }
                  }
              }

              private static void stepWaveEquation() {
                  final float c2 = 0.23f;       // Velocidade de propagacao realista (estavel)
                  final float damping = 0.968f; // Amortecimento natural da agua

                  for (int gz = 1; gz < N - 1; gz++) {
                      int row = gz * N;
                      for (int gx = 1; gx < N - 1; gx++) {
                          int idx = row + gx;
                          if (!isWaterNode[idx] || isBoundaryNode[idx]) {
                              next[idx] = 0.0f;
                              continue;
                          }

                          float center = curr[idx];
                          float left = isWaterNode[idx - 1] ? curr[idx - 1] : center;
                          float right = isWaterNode[idx + 1] ? curr[idx + 1] : center;
                          float up = isWaterNode[idx - N] ? curr[idx - N] : center;
                          float down = isWaterNode[idx + N] ? curr[idx + N] : center;

                          float laplacian = (left + right + up + down) - 4.0f * center;
                          float val = (2.0f * center - prev[idx] + c2 * laplacian) * damping;
                          next[idx] = Mth.clamp(val, -0.34f, 0.42f);
                      }
                  }

                  // Bordas refletem as ondas de volta para dentro da agua (efeito real de praia/parede!)
                  for (int gz = 1; gz < N - 1; gz++) {
                      int row = gz * N;
                      for (int gx = 1; gx < N - 1; gx++) {
                          int idx = row + gx;
                          if (!isBoundaryNode[idx]) continue;

                          float sum = 0.0f;
                          int count = 0;
                          if (isWaterNode[idx - 1] && !isBoundaryNode[idx - 1]) { sum += next[idx - 1]; count++; }
                          if (isWaterNode[idx + 1] && !isBoundaryNode[idx + 1]) { sum += next[idx + 1]; count++; }
                          if (isWaterNode[idx - N] && !isBoundaryNode[idx - N]) { sum += next[idx - N]; count++; }
                          if (isWaterNode[idx + N] && !isBoundaryNode[idx + N]) { sum += next[idx + N]; count++; }

                          if (count > 0) {
                              float reflected = (sum / count) * 0.80f;
                              next[idx] = reflected;
                              if (Math.abs(reflected) > 0.03f) {
                                  foam[idx] = Math.min(1.0f, foam[idx] + Math.abs(reflected) * 1.4f);
                              }
                          } else {
                              next[idx] = 0.0f;
                          }
                      }
                  }

                  // Avanca buffers (prev <- curr <- next)
                  System.arraycopy(curr, 0, prev, 0, curr.length);
                  System.arraycopy(next, 0, curr, 0, curr.length);
              }

              private static void updateFoam() {
                  for (int gz = 1; gz < N - 1; gz++) {
                      int row = gz * N;
                      for (int gx = 1; gx < N - 1; gx++) {
                          int idx = row + gx;
                          if (!isWaterNode[idx]) {
                              foam[idx] = 0.0f;
                              continue;
                          }

                          float f = foam[idx] * 0.91f;
                          float speed = Math.abs(curr[idx] - prev[idx]);
                          if (speed > 0.045f) {
                              f += (speed - 0.045f) * 3.8f;
                          }
                          foam[idx] = Mth.clamp(f, 0.0f, 1.0f);
                      }
                  }
              }
          }
