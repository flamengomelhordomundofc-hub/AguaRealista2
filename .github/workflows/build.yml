                  RenderSystem.enableCull();
                  RenderSystem.disableBlend();
                  poseStack.popPose();
              }

              private static void emitCausticVertex(BufferBuilder buffer, Matrix4f matrix, float x, float y, float z, float time, float strength) {
                  double c1 = Math.sin(x * 2.4 + time * 1.2 + Math.cos(z * 2.1 - time * 0.9));
                  double c2 = Math.cos(z * 2.6 - time * 1.1 + Math.sin(x * 1.9 + time * 1.3));
                  float pattern = (float) Math.pow(Mth.clamp((float) ((c1 * c2) * 0.5 + 0.5), 0.0f, 1.0f), 2.5);
                  float a = pattern * strength;
                  buffer.vertex(matrix, x, y, z).color(0.58f, 0.92f, 1.0f, a).endVertex();
              }

